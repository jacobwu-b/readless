<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate a brief · ReadLess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/brief.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="site-name">ReadLess</a>
      <a href="/" class="back">← All books</a>
    </div>
  </header>

  <main>
    <div class="gen-intro">
      <h1>Generate a brief</h1>
      <p>Enter a book and we'll distill it into a structured brief.</p>
    </div>

    <form class="gen-form" id="gen-form">
      <div class="gen-field">
        <label class="gen-label" for="title">Title</label>
        <input class="gen-input" type="text" id="title" name="title" placeholder="Atomic Habits" required>
      </div>
      <div class="gen-field">
        <label class="gen-label" for="author">Author <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
        <input class="gen-input" type="text" id="author" name="author" placeholder="James Clear">
      </div>
      <button class="gen-submit" type="submit" id="submit">Generate</button>
    </form>

    <div id="status" hidden></div>
    <article id="brief"></article>
  </main>

  <script src="/assets/brief.js"></script>
  <script>
    var form = document.getElementById('gen-form');
    var submitBtn = document.getElementById('submit');
    var statusEl = document.getElementById('status');
    var briefEl = document.getElementById('brief');

    function showStatus(kind, message) {
      statusEl.className = 'gen-status gen-status--' + kind;
      statusEl.textContent = message;
      statusEl.hidden = false;
    }

    function clearStatus() {
      statusEl.hidden = true;
      statusEl.textContent = '';
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      var title = document.getElementById('title').value.trim();
      var author = document.getElementById('author').value.trim();
      if (!title) return;

      briefEl.innerHTML = '';
      submitBtn.disabled = true;
      showStatus('loading', 'Generating brief for "' + title + '"… this can take a minute.');

      var payload = { title: title };
      if (author) payload.author = author;

      try {
        var res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          var detail = await res.json().catch(function () { return {}; });
          throw new Error(detail.error || ('Request failed (' + res.status + ')'));
        }

        var brief = await res.json();
        clearStatus();
        briefEl.innerHTML = window.renderBrief(brief);
      } catch (err) {
        showStatus('error', "Couldn't generate that brief: " + err.message + ' Please try again.');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
