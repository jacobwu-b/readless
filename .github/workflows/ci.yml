# CI — required checks for every PR.
#
# These job names must match the required status checks configured in
# .github/repo-settings.md. If you rename a job, update branch protection.
#
# Stack: TypeScript on Vercel (Node). `tsc --noEmit` is the project's
# static-analysis gate — there is no separate linter yet, so Lint and Types
# both run the typecheck. Vercel builds on deploy, so Build only verifies the
# project compiles. Swap in a dedicated linter/bundler here if one is adopted.
#
# Bootstrap note: until application source lands, the typecheck steps short-
# circuit when no .ts files are tracked. They become real checks automatically
# once the first source file is committed.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run the required checks for PRs queued in the merge queue (see
  # repo-settings.md → "Branch protection — main").
  merge_group:

# Cancel superseded runs on the same branch — saves CI minutes during
# rapid agent iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      # No standalone linter yet — TypeScript strict mode is the gate.
      - name: Lint (typecheck)
        run: |
          if [ -n "$(git ls-files '*.ts' '*.tsx')" ]; then
            npm run typecheck
          else
            echo "No TypeScript sources yet — nothing to lint."
          fi

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: |
          if [ -n "$(git ls-files '*.ts' '*.tsx')" ]; then
            npm run typecheck
          else
            echo "No TypeScript sources yet — nothing to typecheck."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      # Node's built-in runner auto-discovers *.test.ts and exits 0 when none exist.
      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      # Vercel builds on deploy; CI only verifies the project compiles.
      - name: Build (compile check)
        run: |
          if [ -n "$(git ls-files '*.ts' '*.tsx')" ]; then
            npm run typecheck
          else
            echo "No TypeScript sources yet — nothing to build."
          fi

  # Evals: regression suite for the AI agent. PRs that regress evals don't merge.
  # Disable this job until you have ≥20 eval tasks in evals/tasks/ (see brief, Pillar 5).
  evals:
    name: Evals
    runs-on: ubuntu-latest
    if: false # flip to `true` once evals/tasks/ has ≥20 tasks
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Run evals
        run: npm run evals

  # Secret scan — defence in depth. GitHub also scans on push, but this
  # blocks the merge if the push scan was bypassed.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
